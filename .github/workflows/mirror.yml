# Publishes the open parts of this private repo:
#   packages/core   -> rushr-dev/rushr-core  (history kept via git subtree split)
#   registry JSON   -> rushr-dev/registry    (generated from packages/core)
#   oss/profile     -> rushr-dev/rushr-dev   (account profile README)
# Each target has its own write-only deploy key, stored here as a secret.
name: Mirror
on:
  push:
    branches: [main]
    paths: ['packages/core/**', 'oss/**', '.github/workflows/mirror.yml']
  workflow_dispatch:

concurrency: mirror

env:
  GIT_AUTHOR_NAME: rushr-dev
  GIT_AUTHOR_EMAIL: 355387833+rushr-dev@users.noreply.github.com
  GIT_COMMITTER_NAME: rushr-dev
  GIT_COMMITTER_EMAIL: 355387833+rushr-dev@users.noreply.github.com

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CORE_DEPLOY_KEY }}
      - name: Split and push
        run: |
          git subtree split --prefix packages/core -b core-mirror
          git push git@github.com:rushr-dev/rushr-core.git core-mirror:main

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.REGISTRY_DEPLOY_KEY }}
      - name: Generate and push
        run: |
          npm install --prefix packages/core --no-audit --no-fund --omit=dev
          git clone git@github.com:rushr-dev/registry.git out
          node packages/core/scripts/export-registry.ts out
          cp oss/registry/README.md out/README.md
          cd out
          git add -A
          if git diff --cached --quiet; then echo "registry unchanged"; exit 0; fi
          git commit -m "Update registry"
          git push origin HEAD:main

  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PROFILE_DEPLOY_KEY }}
      - name: Push profile README
        run: |
          git clone git@github.com:rushr-dev/rushr-dev.git out
          cp oss/profile/README.md out/README.md
          cd out
          git add -A
          if git diff --cached --quiet; then echo "profile unchanged"; exit 0; fi
          git commit -m "Update profile"
          git push origin HEAD:main
